<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карточка персонажа</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#1c2430;--muted:#6a7686;--line:#cfd6de;--accent:#1f6f78;--accent-ink:#fff;--passive:#7a5a1e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--surface:#1b222b;--ink:#e6ebf0;--muted:#8d99a8;--line:#323c49;--accent:#4fb3bf;--accent-ink:#0d1418;--passive:#d4a95a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--surface:#1b222b;--ink:#e6ebf0;--muted:#8d99a8;--line:#323c49;--accent:#4fb3bf;--accent-ink:#0d1418;--passive:#d4a95a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.stage{width:min(100%,calc((100vh - 32px)*16/9));aspect-ratio:16/9;margin:16px auto;padding:18px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:22px}
.left{display:flex;flex-direction:column;min-height:0}
.right{display:flex;flex-direction:column;min-height:0}
.right>section{flex:1;min-height:0;overflow:auto;padding:2px 6px 2px 2px}
@media(max-width:820px){.stage{aspect-ratio:auto;width:100%;margin:0;border:0;border-radius:0;grid-template-columns:1fr;grid-template-rows:auto;gap:16px}#drop{flex:none;aspect-ratio:3/4;max-height:60vh}.right>section{overflow:visible}}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0 0 10px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;margin-bottom:-2px;padding:10px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);border-color:transparent}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
[hidden]{display:none!important}
.top{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:24px;align-items:start}
@media(max-width:720px){.top{grid-template-columns:1fr}}
#drop{flex:1;min-height:0;border:2px dashed var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;padding:12px}
#drop:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#drop.over{border-color:var(--accent);color:var(--accent)}
#drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgbar{display:flex;gap:8px;margin-top:8px}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fields{display:grid;gap:14px;max-width:420px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.fields input,.fields select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
h2{font:700 19px/1.2 Georgia,serif;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.active{grid-template-columns:repeat(2,minmax(0,1fr))}
.passive{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:480px){.active{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card.p{border-left-color:var(--passive)}
.card input,.card textarea{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:3px 0;resize:vertical}
.card input{font-weight:700;font-size:17px}
.card textarea{min-height:70px}
.card input:hover,.card textarea:hover,.card input:focus,.card textarea:focus{border-bottom-color:var(--line);outline:none}
.card input::placeholder,.card textarea::placeholder{color:var(--muted);font-weight:400}
.nums{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .nums input{width:9ch;font-size:15px;font-weight:600;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg)}
.card .nums input:hover,.card .nums input:focus{border-color:var(--accent)}
.card .nums input.neg{background:color-mix(in srgb,#b5482f 24%,var(--surface));border-color:#b5482f}
.card .nums input.pos{background:color-mix(in srgb,#5f9a5a 20%,var(--surface));border-color:#5f9a5a}
.tu{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);font-weight:600;font-size:15px}
.card .tu input{width:7ch;border:0;background:transparent;padding:0;text-align:left}
.tu span{color:var(--muted)}
.count{display:inline-flex;align-items:center;gap:8px;font:400 16px "Trebuchet MS",sans-serif}
.count button{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.count span{min-width:1.5ch;text-align:center}
@media(max-width:600px){
main{padding:12px 12px 32px}
h1{font-size:22px;margin-bottom:10px}
.tabs{overflow-x:visible;gap:2px;margin-bottom:16px}
.tab{flex:1 1 0;min-width:0;padding:8px 4px;font-size:14px;line-height:1.2;white-space:normal;text-align:center;min-height:48px}
.top{gap:16px}
.top>div:first-child{width:100%;max-width:260px;margin:0 auto}
.fields{max-width:none}
.fields input,.fields select{font-size:16px;padding:10px}
.active{grid-template-columns:1fr}
.passive{grid-template-columns:1fr}
.card input,.card .nums input{font-size:16px}
.card textarea{font-size:16px}
button{min-height:40px}
.count button{width:40px;height:40px}
}
main{padding-bottom:96px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;min-height:0;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:20}
.fab:hover{border:0;filter:brightness(1.08)}
.fab.disk{right:auto;left:16px}
.fab.disk svg{transition:none}
.fab{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.fab.dragging{cursor:grabbing;filter:brightness(1.15)}
.menu.left{right:auto;left:16px}
.lang{padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.lang select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fab svg{width:28px;height:28px;fill:currentColor;transition:transform .3s}
.fab[aria-expanded="true"] svg{transform:rotate(60deg)}
.menu{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(280px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.28);overflow:hidden;z-index:20}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:13px 16px;min-height:48px}
.menu button+button{border-top:1px solid var(--line)}
.menu button:hover{background:var(--bg)}
.menu .danger{color:#b5482f}
.menu .danger.armed{background:#b5482f;color:#fff}
#msg{padding:10px 16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-head h2{margin:0}
.save-row{display:flex;gap:8px;flex-wrap:wrap}
.save-row input,.entry input{flex:1 1 160px;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.lmsg{margin-top:10px;font-size:14px;color:var(--muted)}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.entry .nm{font-weight:700;overflow-wrap:anywhere}
.entry .dt{font-size:13px;color:var(--muted)}
.entry .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.entry .acts button{padding:6px 10px;font-size:14px}
.entry .rn{display:flex;gap:6px;flex-wrap:wrap}
button.armed{background:#b5482f;color:#fff;border-color:#b5482f}
.empty{color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<main class="stage">
<aside class="left">
  <div id="drop" tabindex="0" role="button" aria-label="Вставить изображение">
    <span id="hint">Нажмите, перетащите файл сюда<br>или вставьте из буфера (Ctrl+V)</span>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="imgbar"><button id="pick" class="pri">Выбрать изображение</button><button id="clear">Убрать</button></div>
</aside>
<div class="right">
<h1>Карточка персонажа</h1>

<div class="tabs" role="tablist" aria-label="Разделы">
  <button class="tab" role="tab" id="t-stats" aria-controls="p-stats" aria-selected="true">Характеристики</button>
  <button class="tab" role="tab" id="t-skills" aria-controls="p-skills" aria-selected="false" tabindex="-1">Активные умения</button>
  <button class="tab" role="tab" id="t-passive" aria-controls="p-passive" aria-selected="false" tabindex="-1">Пассивные умения</button>
</div>

<section id="p-stats" role="tabpanel" aria-labelledby="t-stats">
    <div class="fields">
      <label>Имя<input id="f-name" placeholder="Введите имя" maxlength="60"></label>
      <label>Редкость<select id="f-rarity"><option value="">Выберите</option><option>★</option><option>★★</option><option>★★★</option><option>★★★★</option><option>★★★★★</option><option>★★★★★★</option></select></label>
      <label>Стихия<select id="f-element"><option value="">Выберите</option><option value="Огонь">Огонь</option><option value="Вода">Вода</option><option value="Земля">Земля</option><option value="Электричество">Электричество</option><option value="Свет">Свет</option><option value="Тьма">Тьма</option></select></label>
      <label>Боевая сила<input id="f-power" inputmode="numeric" placeholder="0" maxlength="9"></label>
      <label>Атака<input id="f-atk" inputmode="numeric" placeholder="0" maxlength="9"></label>
      <label>Здоровье<input id="f-hp" inputmode="numeric" placeholder="0" maxlength="9"></label>
      <label>Скорость<input id="f-spd" inputmode="numeric" placeholder="0" maxlength="9"></label>
    </div>
</section>

<section id="p-skills" role="tabpanel" aria-labelledby="t-skills" hidden>
  <h2>Активные умения</h2>
  <div class="grid active" id="active"></div>
</section>

<section id="p-passive" role="tabpanel" aria-labelledby="t-passive" hidden>
  <h2>Пассивные умения
    <span class="count">
      <button id="minus" aria-label="Убрать одну табличку">−</button>
      <span id="num">6</span>
      <button id="plus" aria-label="Добавить табличку">+</button>
    </span>
  </h2>
  <div class="grid passive" id="passive"></div>
</section>
</div>
</main>

<button class="fab" id="gear" aria-label="Меню" title="Меню" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
</button>
<div class="menu" id="menu" role="menu" hidden>
  <div class="lang"><label for="lang">Язык</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <button role="menuitem" id="m-reset" class="danger">Сбросить всё</button>
  <div id="msg" role="status" hidden></div>
</div>
<button class="fab disk" id="disk" aria-label="Файлы и библиотека" title="Файлы и библиотека" aria-haspopup="true" aria-expanded="false" aria-controls="fmenu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
</button>
<div class="menu left" id="fmenu" role="menu" hidden>
  <button role="menuitem" id="m-lib">Библиотека</button>
  <button role="menuitem" id="m-down">Скачать данные</button>
  <button role="menuitem" id="m-up">Загрузить данные</button>
  <button role="menuitem" id="m-img">Выгрузить картинкой</button>
  <div id="msg2" role="status" hidden style="padding:10px 16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)"></div>
</div>
<input id="imp" type="file" accept=".json,application/json" hidden>
<div class="modal" id="lib" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lib-title">
    <div class="sh-head"><h2 id="lib-title">Библиотека</h2><button id="lib-close" aria-label="Закрыть">✕</button></div>
    <div class="save-row"><input id="lib-name" placeholder="Название записи" maxlength="60" aria-label="Название записи"><button class="pri" id="lib-save">Сохранить текущее</button></div>
    <div id="lib-msg" class="lmsg" role="status" hidden></div>
    <div id="lib-list"></div>
  </div>
</div>

<script>
(function(){
  // i18n
  var DICT={
"Карточка персонажа":"Character Sheet","Характеристики":"Stats","Активные умения":"Active Skills","Пассивные умения":"Passive Skills",
"Имя":"Name","Введите имя":"Enter a name","Редкость":"Rarity","Стихия":"Element","Выберите":"Select",
"Огонь":"Fire","Вода":"Water","Земля":"Earth","Электричество":"Storm","Свет":"Light","Тьма":"Dark",
"Боевая сила":"Total Power","Атака":"Attack","Здоровье":"HP","Скорость":"Speed",
"Вставить изображение":"Insert image","Нажмите, перетащите файл сюда":"Click or drag a file here","или вставьте из буфера (Ctrl+V)":"or paste from the clipboard (Ctrl+V)",
"Выбрать изображение":"Choose image","Убрать":"Remove","Разделы":"Sections","Изображение персонажа":"Character image",
"Название умения":"Skill name","Пассивное умение":"Passive skill","Описание":"Description",
"Число от −10 до +10":"Number from −10 to +10","Число от 0 до 999":"Number from 0 to 999",
"Убрать одну табличку":"Remove one card","Добавить табличку":"Add a card",
"Меню":"Menu","Язык":"Language","Сбросить всё":"Reset all","Нажмите ещё раз для сброса":"Press again to reset","Всё сброшено":"Everything has been reset",
"Файлы и библиотека":"Files and library","Библиотека":"Library","Скачать данные":"Download data","Загрузить данные":"Upload data","Закрыть":"Close",
"Название записи":"Entry name","Сохранить текущее":"Save current","Файл сохранён":"File saved","Не удалось скачать":"Download failed",
"Данные загружены":"Data loaded","Не удалось прочитать файл":"Could not read the file",
"Не хватило места в браузере. Удалите ненужные записи и попробуйте снова.":"Not enough browser storage. Delete unneeded entries and try again.",
"Пока ничего не сохранено.":"Nothing saved yet.","Новое название":"New name","ОК":"OK","Отмена":"Cancel",
"Загрузить":"Load","Перезаписать":"Overwrite","Переименовать":"Rename","Удалить":"Delete",
"Заменить текущее?":"Replace current?","Перезаписать текущим?":"Overwrite with current?","Точно удалить?":"Really delete?",
"Запись удалена":"Entry deleted","Выгрузить картинкой":"Export as image","Картинка сохранена":"Image saved","Не удалось создать картинку":"Could not create the image","Без названия":"Untitled",
"Последняя табличка заполнена. Удалить её?":"The last card is filled in. Delete it?",
"Изображение показано, но сохранить его в браузере не удалось.":"The image is shown, but it could not be saved in the browser."
  };
  var lang="ru";
  try{lang=localStorage.getItem("skills-sheet-lang")==="en"?"en":"ru"}catch(e){}
  function plusFmt(v){return v!==""&&v!=="-"&&parseInt(v,10)>=0?"+"+v:v}
  function T(x){return lang==="en"&&DICT[x]?DICT[x]:x}
  var LATTRS=["placeholder","title","aria-label","alt"];
  function applyLang(){
    var en=lang==="en";
    document.documentElement.lang=lang;
    document.title=en?DICT["Карточка персонажа"]:"Карточка персонажа";
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n,nodes=[];
    while(n=w.nextNode())nodes.push(n);
    nodes.forEach(function(n){
      var par=n.parentNode;
      if(par&&par.closest&&par.closest(".nm,textarea,script"))return;
      var src=n.__ru!==undefined?n.__ru:n.nodeValue,key=src.trim();
      if(!key)return;
      if(en){var tr=DICT[key];if(tr){n.__ru=src;n.nodeValue=src.split(key).join(tr)}}
      else if(n.__ru!==undefined){n.nodeValue=n.__ru;delete n.__ru}
    });
    document.querySelectorAll("[placeholder],[title],[aria-label],[alt]").forEach(function(el){
      LATTRS.forEach(function(a){
        if(!el.hasAttribute(a))return;
        var k="data-ru-"+a,cur=el.hasAttribute(k)?el.getAttribute(k):el.getAttribute(a);
        if(en){if(DICT[cur]){el.setAttribute(k,cur);el.setAttribute(a,DICT[cur])}}
        else if(el.hasAttribute(k)){el.setAttribute(a,el.getAttribute(k));el.removeAttribute(k)}
      });
    });
  }
  function setLang(l){
    lang=l==="en"?"en":"ru";
    try{localStorage.setItem("skills-sheet-lang",lang)}catch(e){}
    disarm();say("");lsay("");
    refreshAll();renderLib();applyLang();
  }

  var KEY="skills-sheet-v1",IMG_KEY="skills-sheet-img-v1";
  var state={active:[],passive:[]};
  try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.active&&s.passive)state=s}catch(e){}
  state.meta=state.meta||{name:"",rarity:"",element:""};
  while(state.active.length<4)state.active.push({n:"",d:""});
  state.active=state.active.slice(0,4);
  if(!state.passive.length)for(var i=0;i<6;i++)state.passive.push({n:"",d:""});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  // Tabs
  var tabs=[["t-stats","p-stats"],["t-skills","p-skills"],["t-passive","p-passive"]];
  function openTab(k,focus){
    tabs.forEach(function(p,j){
      var t=document.getElementById(p[0]),on=j===k;
      t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1;
      document.getElementById(p[1]).hidden=!on;
      if(on&&focus)t.focus();
    });
  }
  tabs.forEach(function(p,j){
    var t=document.getElementById(p[0]);
    t.onclick=function(){openTab(j)};
    t.onkeydown=function(e){
      if(e.key==="ArrowRight")openTab((j+1)%3,true);
      else if(e.key==="ArrowLeft")openTab((j+2)%3,true);
    };
  });

  // Cards
  function card(list,idx,cls,ph,withNums){

      a.oninput=function(){

        if(!dg)v=neg?"-":"";else{var m=Math.min(10,parseInt(dg,10));v=(neg&&m>0?"-":"")+m}

      var u=document.createElement("span");u.textContent="TU";

  function fitText(c,t,maxW){
    t=String(t);if(c.measureText(t).width<=maxW)return t;
    while(t&&c.measureText(t+"…").width>maxW)t=t.slice(0,-1);

  function wrapText(c,text,maxW,maxLines){
    var out=[];

        if(!word)return;
        while(c.measureText(word).width>maxW){
          var k=word.length;while(k>1&&c.measureText(word.slice(0,k)).width>maxW)k--;
          if(line){out.push(line);line=""}
          out.push(word.slice(0,k));word=word.slice(k);
        }
        var test=line?line+" "+word:word;
        if(c.measureText(test).width>maxW&&line){out.push(line);line=word}else line=test;
      });
      out.push(line);
    });
    if(out.length>maxLines){out=out.slice(0,maxLines);out[maxLines-1]=fitText(c,out[maxLines-1]+"…",maxW)}
    return out;
  }

    c.font=pre+min+"px "+fam;return min;
  }

    }
    size=min;c.font=size+"px "+fam;lh=Math.round(size*1.3);
    return {size:size,lh:lh,lines:wrapText(c,text,maxW,Math.max(1,Math.floor(maxH/lh)))};
  }

  function drawSheet(img){
    var OW=1920,OH=1080,cv=document.createElement("canvas");cv.width=OW;cv.height=OH;
    var c=cv.getContext("2d"),M=state.meta,BIG=1e9,TOP=96,BOT=1034,GAP=14;
    var F='"Trebuchet MS","Segoe UI",system-ui,sans-serif',FS='Georgia,"Times New Roman",serif';
    var INK="#e6ebf0",MUT="#8d99a8",SUR="#1b222b",LINE="#323c49",ACC="#4fb3bf",GOLD="#d4a95a";
    // measure left column
    var lx=40,lw=420;
    c.font="bold 44px "+FS;
    var nameLines=wrapText(c,M.name||"—",lw,BIG),ph=Math.max(300,560-(nameLines.length-1)*52),base=40+ph;
    // measure active skills
    var mx=500,mw=600;
    var acts=state.active.map(function(sk){
      c.font="bold 28px "+F;var nl=wrapText(c,sk.n||"—",mw-44,BIG);
      c.font="22px "+F;var dl=sk.d?wrapText(c,sk.d,mw-48,BIG):[];
      var chips=(sk.a!==undefined&&sk.a!=="")||!!sk.t;
      var h=Math.max(224,20+nl.length*34+6+(chips?46:0)+dl.length*30+(dl.length?4:0)+16);
      return {sk:sk,nl:nl,dl:dl,chips:chips,h:h};
    });
    // measure passive skills
    var pw=360;

      c.font="bold 26px "+F;var nl=wrapText(c,p.n||"—",pw-36,BIG);
      c.font="21px "+F;var dl=p.d?wrapText(c,p.d,pw-40,BIG):[];
      var h=Math.max(170,16+nl.length*32+8+dl.length*28+(dl.length?4:0)+16);
      return {p:p,nl:nl,dl:dl,h:h};
    });
    // flow cards into columns; a card that does not fit moves to the next column
    function flow(items,limit){
      var col=0,y=TOP,pos=[];

        pos.push({col:col,y:y});y+=it.h+GAP;
      });
      return {cols:items.length?col+1:0,pos:pos};
    }
    function layout(items){

    pas.forEach(function(it,i){bottom=Math.max(bottom,pL.pos[i].y+it.h)});

    c.fillStyle="#1d2630";c.fillRect(lx,40,lw,ph);
    if(img){var k=Math.max(lw/img.width,ph/img.height),iw=img.width*k,ih=img.height*k;c.drawImage(img,lx+(lw-iw)/2,40+(ph-ih)/2,iw,ih)}
    c.restore();
    c.strokeStyle=LINE;c.lineWidth=2;rrect(c,lx,40,lw,ph,18);c.stroke();
    // name, rarity, element
    c.fillStyle=INK;c.font="bold 44px "+FS;
    nameLines.forEach(function(l,i){c.fillText(l,lx,base+72+i*52)});
    var by=base+(nameLines.length-1)*52;
    c.fillStyle=MUT;c.font="18px "+F;c.fillText(T("Редкость"),lx,by+106);
    c.textAlign="right";c.fillText(T("Стихия"),lx+lw,by+106);

    c.textAlign="right";c.fillStyle=ACC;c.font="bold 30px "+F;c.fillText(M.element?T(M.element):"—",lx+lw,by+144);
    c.textAlign="left";
    [["Боевая сила","power"],["Атака","atk"],["Здоровье","hp"],["Скорость","spd"]].forEach(function(r,i){
      var y=by+176+i*60;
      c.fillStyle=SUR;rrect(c,lx,y,lw,50,10);c.fill();
      c.fillStyle=MUT;c.font="22px "+F;c.fillText(T(r[0]),lx+16,y+33);
      c.textAlign="right";c.fillStyle=INK;c.font="bold 28px "+F;c.fillText(M[r[1]]||"—",lx+lw-16,y+35);c.textAlign="left";
    });
    // active skills
    c.fillStyle=ACC;c.font="bold 30px "+FS;c.fillText(T("Активные умения"),mx,70);
    acts.forEach(function(it,i){
      var sk=it.sk,x=mx+aL.pos[i].col*(mw+GAP),y=aL.pos[i].y,yy=y+20;

          c.fillStyle=neg?"#7a2f20":"#2f5a2d";rrect(c,cx,yy,84,34,8);c.fill();
          c.strokeStyle=neg?"#b5482f":"#5f9a5a";c.lineWidth=2;rrect(c,cx,yy,84,34,8);c.stroke();
          c.fillStyle=INK;c.font="bold 22px "+F;c.textAlign="center";
          c.fillText(neg?"−"+sk.a.replace("-",""):"+"+sk.a,cx+42,yy+25);c.textAlign="left";
          cx+=100;
        }
        if(sk.t){c.fillStyle=INK;c.font="bold 26px "+F;c.fillText(sk.t+" TU",cx,yy+26)}
        yy+=46;
      }
      c.fillStyle=MUT;c.font="22px "+F;
      it.dl.forEach(function(l,j){c.fillText(l,x+24,yy+20+j*30)});
    });
    // passive skills
    c.fillStyle=GOLD;c.font="bold 30px "+FS;c.fillText(T("Пассивные умения"),px,70);
    if(!pas.length){c.fillStyle=MUT;c.font="24px "+F;c.fillText("—",px,120)}
    pas.forEach(function(it,i){
      var x=px+pL.pos[i].col*(pw+GAP),y=pL.pos[i].y,yy=y+16;
      c.fillStyle=SUR;rrect(c,x,y,pw,it.h,12);c.fill();

      c.fillStyle=INK;c.font="bold 26px "+F;
      it.nl.forEach(function(l,j){c.fillText(l,x+22,yy+24+j*32)});
      yy+=it.nl.length*32+8;
      c.fillStyle=MUT;c.font="21px "+F;
      it.dl.forEach(function(l,j){c.fillText(l,x+22,yy+18+j*28)});
    });

  }

    var finish=function(img){
      try{
        var cv=drawSheet(img);
        var fname=((state.meta.name||"character").replace(/[^\wа-яёА-ЯЁ-]+/g,"_")||"character")+".png";
        cv.toBlob(function(blob){
          if(!blob){say(T("Не удалось создать картинку"));return}
          saveBlob(blob,fname);say(T("Картинка сохранена"));
        },"image/png");
      }catch(err){say(T("Не удалось создать картинку"))}
    };
    if(cur){var im=new Image();im.onload=function(){finish(im)};im.onerror=function(){finish(null)};im.src=cur.src}
    else finish(null);
  };

  var imp=document.getElementById("imp");
  document.getElementById("m-up").onclick=function(){imp.click()};
  function clean(list,withNums){
    return list.map(function(x){
      x=x||{};var o={n:String(x.n||"").slice(0,200),d:String(x.d||"").slice(0,5000)};
      if(withNums){
        var a=String(x.a||"").replace(/^\+/,""),t=String(x.t||"");
        var an=parseInt(a,10),tn=parseInt(t,10);
        o.a=/^-?\d{1,2}$/.test(a)&&an>=-10&&an<=10?String(an):"";
        o.t=/^\d{1,3}$/.test(t)&&tn>=0?String(tn):"";
      }
      return o;
    });
  }
  imp.onchange=function(){
    var f=imp.files[0];imp.value="";if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result),s2=d&&d.state;
        if(!s2||!Array.isArray(s2.active)||!Array.isArray(s2.passive))throw 0;
        var act=clean(s2.active.slice(0,4),true);
        while(act.length<4)act.push({n:"",d:"",a:"",t:""});
        state.active=act;
        state.passive=clean(s2.passive.slice(0,30),false);
        var m=s2.meta||{};state.meta={name:"",rarity:"",element:""};
        METAIDS.forEach(function(p){state.meta[p[1]]=String(m[p[1]]||"").slice(0,60)});
        save();
        var url=typeof d.image==="string"&&d.image.indexOf("data:image/")===0?d.image:"";
        setImage(url);
        try{if(url)localStorage.setItem(IMG_KEY,url);else localStorage.removeItem(IMG_KEY)}catch(e){}
        refreshAll();say(T("Данные загружены"));
      }catch(e){say(T("Не удалось прочитать файл"))}
    };
    r.readAsText(f);
  };

  // Library
  var LIB_KEY="skills-sheet-lib-v1",lib=[],renaming=null;
  try{lib=JSON.parse(localStorage.getItem(LIB_KEY)||"[]");if(!Array.isArray(lib))lib=[]}catch(e){lib=[]}
  lib=lib.filter(function(e){return e&&e.id&&e.data&&e.data.state&&Array.isArray(e.data.state.active)&&Array.isArray(e.data.state.passive)});
  var libEl=document.getElementById("lib"),libList=document.getElementById("lib-list"),libName=document.getElementById("lib-name"),libMsg=document.getElementById("lib-msg");
  function lsay(t){libMsg.textContent=t;libMsg.hidden=!t}
  function saveLib(){
    try{localStorage.setItem(LIB_KEY,JSON.stringify(lib));return true}
    catch(e){lsay(T("Не хватило места в браузере. Удалите ненужные записи и попробуйте снова."));return false}
  }
  function snapshot(){
    var cur=drop.querySelector("img");
    return {state:JSON.parse(JSON.stringify(state)),image:cur?cur.src:""};
  }
  function applyData(d){
    var s2=d.state;
    var act=clean(s2.active.slice(0,4),true);
    while(act.length<4)act.push({n:"",d:"",a:"",t:""});
    state.active=act;state.passive=clean(s2.passive.slice(0,30),false);
    var m=s2.meta||{};state.meta={name:"",rarity:"",element:""};
    METAIDS.forEach(function(p){state.meta[p[1]]=String(m[p[1]]||"").slice(0,60)});
    save();
    var url=typeof d.image==="string"&&d.image.indexOf("data:image/")===0?d.image:"";
    setImage(url);
    try{if(url)localStorage.setItem(IMG_KEY,url);else localStorage.removeItem(IMG_KEY)}catch(e){}
    refreshAll();
  }
  function twoStep(btn,text,fn){
    var armed=false,orig=btn.textContent,t;
    btn.onclick=function(){
      if(!armed){armed=true;btn.classList.add("armed");btn.textContent=T(text);
        t=setTimeout(function(){armed=false;btn.classList.remove("armed");btn.textContent=T(orig)},4000);return}
      clearTimeout(t);fn();
    };
  }
  function mkBtn(label,fn){var b=document.createElement("button");b.textContent=label;if(fn)b.onclick=fn;return b}
  function find(id){for(var i=0;i<lib.length;i++)if(lib[i].id===id)return lib[i]}
  function renderLib(){
    libList.innerHTML="";
    if(!lib.length){var p=document.createElement("p");p.className="empty";p.textContent="Пока ничего не сохранено.";libList.appendChild(p);applyLang();return}
    lib.forEach(function(e){
      var box=document.createElement("div");box.className="entry";
      if(renaming===e.id){
        var row=document.createElement("div");row.className="rn";
        var inp=document.createElement("input");inp.value=e.name;inp.maxLength=60;inp.setAttribute("aria-label","Новое название");
        var commit=function(){var v=inp.value.trim();if(v){e.name=v;saveLib()}renaming=null;renderLib()};
        inp.onkeydown=function(ev){ev.stopPropagation();if(ev.key==="Enter")commit();else if(ev.key==="Escape"){renaming=null;renderLib()}};
        row.appendChild(inp);row.appendChild(mkBtn("ОК",commit));row.appendChild(mkBtn("Отмена",function(){renaming=null;renderLib()}));
        box.appendChild(row);
        setTimeout(function(){inp.focus();inp.select()},0);
      }else{
        var nm=document.createElement("div");nm.className="nm";nm.textContent=e.name;
        var dt=document.createElement("div");dt.className="dt";
        dt.textContent=new Date(e.ts).toLocaleString(lang==="en"?"en-US":"ru-RU",{dateStyle:"short",timeStyle:"short"});
        var acts=document.createElement("div");acts.className="acts";
        var bl=mkBtn("Загрузить"),bo=mkBtn("Перезаписать"),br=mkBtn("Переименовать",function(){renaming=e.id;renderLib()}),bd=mkBtn("Удалить");
        twoStep(bl,"Заменить текущее?",function(){applyData(e.data);toggleLib(false);toggle(false)});
        twoStep(bo,"Перезаписать текущим?",function(){
          var old=e.data,oldTs=e.ts;e.data=snapshot();e.ts=Date.now();
          if(saveLib()){lsay(lang==="en"?"Entry “"+e.name+"” overwritten":"Запись «"+e.name+"» перезаписана")}else{e.data=old;e.ts=oldTs}
          renderLib();
        });
        twoStep(bd,"Точно удалить?",function(){
          var i=lib.indexOf(e);lib.splice(i,1);
          if(saveLib())lsay(T("Запись удалена"));else lib.splice(i,0,e);
          renderLib();
        });
        [bl,bo,br,bd].forEach(function(b){acts.appendChild(b)});
        box.appendChild(nm);box.appendChild(dt);box.appendChild(acts);
      }
      libList.appendChild(box);
    });
    applyLang();
  }
  function toggleLib(open){
    libEl.hidden=!open;
    if(open){lsay("");renaming=null;libName.value=state.meta.name||"";renderLib();libName.focus()}
    else disk.focus();
  }
  document.getElementById("m-lib").onclick=function(){toggleFiles(false);toggleLib(true)};
  document.getElementById("lib-close").onclick=function(){toggleLib(false)};
  libEl.addEventListener("click",function(e){if(e.target===libEl)toggleLib(false)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!libEl.hidden)toggleLib(false)});
  document.getElementById("lib-save").onclick=function(){
    var name=libName.value.trim()||state.meta.name||T("Без названия");
    var entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,ts:Date.now(),data:snapshot()};
    lib.unshift(entry);
    if(saveLib()){lsay(lang==="en"?"Saved: “"+name+"”":"Сохранено: «"+name+"»")}else lib.shift();
    renderLib();
  };
  var langSel=document.getElementById("lang");
  langSel.value=lang;
  langSel.onchange=function(){setLang(langSel.value)};
  applyLang();
})();
</script>
</body>
</html>
